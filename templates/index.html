<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alzheimer's Risk Predictor</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <main class="app-container">
        <header class="app-header">
            <h1>Alzheimer's Risk Predictor</h1>
            <p>Enter the patient's metrics below for an instant assessment.</p>
        </header>

        <!-- Display Errors if any -->
        {% if error %}
            <div class="alert alert-danger">
                <strong>Error:</strong> {{ error }}
            </div>
        {% endif %}

        <!-- Display Prediction Result -->
        {% if prediction %}
            <div class="result-box {{ result_class }}">
                <h2>{{ prediction }}</h2>
                <p>Probability: <strong>{{ probability }}%</strong></p>
            </div>
        {% endif %}

        <!-- Prediction Form -->
        <form action="/predict" method="POST" class="predict-form">
            <div class="form-grid">
                
                <div class="input-group">
                    <label for="FunctionalAssessment">Functional Assessment</label>
                    <input type="number" step="any" id="FunctionalAssessment" name="FunctionalAssessment" required placeholder="e.g. 5.5">
                </div>

                <div class="input-group">
                    <label for="ADL">ADL Score</label>
                    <input type="number" step="any" id="ADL" name="ADL" required placeholder="e.g. 4.2">
                </div>

                <div class="input-group">
                    <label for="MemoryComplaints">Memory Complaints</label>
                    <select id="MemoryComplaints" name="MemoryComplaints" required>
                        <option value="" disabled selected>Select</option>
                        <option value="0">No (0)</option>
                        <option value="1">Yes (1)</option>
                    </select>
                </div>

                <div class="input-group">
                    <label for="MMSE">MMSE Score</label>
                    <input type="number" step="any" id="MMSE" name="MMSE" required placeholder="0 - 30">
                </div>

                <div class="input-group">
                    <label for="BehavioralProblems">Behavioral Problems</label>
                    <select id="BehavioralProblems" name="BehavioralProblems" required>
                        <option value="" disabled selected>Select</option>
                        <option value="0">No (0)</option>
                        <option value="1">Yes (1)</option>
                    </select>
                </div>

                <div class="input-group">
                    <label for="SleepQuality">Sleep Quality</label>
                    <input type="number" step="any" id="SleepQuality" name="SleepQuality" required placeholder="e.g. 6.8">
                </div>

                <div class="input-group">
                    <label for="CholesterolHDL">Cholesterol HDL</label>
                    <input type="number" step="any" id="CholesterolHDL" name="CholesterolHDL" required placeholder="e.g. 55.0">
                </div>

            </div>

            <button type="submit" class="submit-btn">Generate Prediction</button>
        </form>
    </main>
</body>
</html>
